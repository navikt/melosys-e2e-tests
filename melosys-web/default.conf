server {
  root /usr/share/nginx/html;
  listen       3000;
  include /etc/nginx/mime.types;
  proxy_http_version 1.1;

  location /api/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass "http://melosys-api.melosys.docker-internal:8080/api/";
  }

  location /melosys/api/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass "http://melosys-api.melosys.docker-internal:8080/api/";
  }

  location  /trygdeavtale-flyt/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass "http://melosys-trygdeavtale.melosys.docker-internal:8088/flyt/";
  }

  location  /faktureringskomponenten/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass "http://faktureringskomponenten.melosys.docker-internal:8084/";
  }

  location  /graphql/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass "http://melosys-api.melosys.docker-internal:8080/graphql/";
  }

  location = /env-config.js {
    alias /etc/nginx/conf.d/env-config.js;
    add_header Cache-Control 'no-store';
    add_header Cache-Control 'no-cache';
    expires 0;
  }

  location /melosys/env-config.js {
    add_header Cache-Control 'no-store';
    add_header Cache-Control 'no-cache';
    expires 0;
    try_files $uri /env-config.js;
  }

  location /melosys/assets/ {
    alias /usr/share/nginx/html/assets/;
  }

  location /melosys/ {
    add_header Cache-Control 'no-store';
    add_header Cache-Control 'no-cache';
    expires 0;
    try_files $uri /index.html;
  }

  location = / {
    rewrite ^.+ https://$host/melosys/ permanent;
  }
}
