name: Koblet merge
run-name: "Koblet merge · ${{ inputs.requested_by || 'ukjent' }}: ${{ inputs.tag }} · e2e #${{ inputs.e2e_pr }} · ${{ inputs.tjenester }}${{ inputs.dry_run && ' (prøvekjøring)' || '' }}"

# Setter pinnen for en koblet endring: service-PR-er som krever nye e2e-tester, og e2e-PR-en som
# retter testene. melosys-console starter workflowen. Den sjekker paret og skriver pinnen i
# Actions-variabelen E2E_PINS med scripts/e2e-pins.mjs; utvikleren merger PR-ene selv med
# «Merge when ready» i rekkefølgen sammendraget viser. Lesing bruker github.token (alle repoene
# er offentlige); bare skrivingen av variabelen bruker app-tokenet.
# Oppskriften står i docs/ci-cd/KOBLEDE-ENDRINGER.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Taggen fra «E2E med brancher»: br-<run_id>'
        required: true
        type: string
      e2e_pr:
        description: 'PR-nummeret i melosys-e2e-tests'
        required: true
        type: string
      tjenester:
        description: '<repo>#<pr> i merge-rekkefølge, kommaseparert (f.eks. melosys-skjema-api#422,melosys-skjema-web#695). Bare repoer med merge-kø.'
        required: true
        type: string
      requested_by:
        description: 'Hvem som bestilte kjøringen. Settes av melosys-console.'
        required: false
        type: string
        default: ukjent
      dry_run:
        description: 'Les og sjekk alt, men skriv ikke variabelen'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: koblet-merge-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  E2E_PR: ${{ inputs.e2e_pr }}
  TJENESTER: ${{ inputs.tjenester }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  DRY_RUN: ${{ inputs.dry_run }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sjekk:
    name: Sjekk paret
    runs-on: ubuntu-latest
    # Rom for at timekvoten fornyes (inntil 3 × 15 min i ett kall)
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.input.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Les input
        id: input
        run: node scripts/koblet-merge.mjs input
      - name: Sjekk PR-ene
        run: node scripts/koblet-merge.mjs sjekk

  pin:
    name: Skriv pinnen i E2E_PINS
    needs: sjekk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      # gh run download av trigger-konteksten til br-kjøringen
      actions: read
      # nais/login: skriveren leser revisjonen på latest for pinnene som står
      id-token: write
    # API-et har ingen sammenlign-og-skriv for variabler, så skrivingene går én om gangen.
    # En prøvekjøring skriver ikke, og får en egen gruppe: i samme gruppe kunne den erstattet
    # en ekte skriving som venter.
    concurrency:
      group: ${{ inputs.dry_run && format('e2e-pins-prove-{0}', github.run_id) || 'e2e-pins-variabel' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to NAIS registry
        uses: nais/login@v0
        with:
          team: teammelosys
      # Uten permission-*: action-en har ingen input for variabler, så tokenet får rettighetene
      # installasjonen har, men bare i melosys-e2e-tests.
      - name: Hent app-token
        id: token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: melosys-e2e-tests
      # github.token kan ikke lese variabler. En prøvekjøring leser derfor verdien fra vars,
      # låst ved jobbstart; en ekte skriving leser den med app-tokenet rett før den skriver.
      - name: Skriv pinnen
        env:
          E2E_PINS_TOKEN: ${{ steps.token.outputs.token }}
          E2E_PINS_VAR: ${{ vars.E2E_PINS }}
          MATRIX: ${{ needs.sjekk.outputs.matrix }}
        run: |
          flagg=()
          if [ "$DRY_RUN" = "true" ]; then flagg=(--dry-run); fi
          while read -r repo pr; do
            node scripts/e2e-pins.mjs set "$repo" "$TAG" "$E2E_PR" "$pr" "${flagg[@]}"
          done < <(jq -r '.include[] | "\(.repo) \(.pr)"' <<< "$MATRIX")
      - name: Neste steg
        run: node scripts/koblet-merge.mjs neste
