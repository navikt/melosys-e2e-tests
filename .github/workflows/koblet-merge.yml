name: Koblet merge
run-name: "Koblet merge · ${{ inputs.requested_by || 'ukjent' }}: ${{ inputs.tag }} · e2e #${{ inputs.e2e_pr }} · ${{ inputs.tjenester }}${{ inputs.dry_run && ' (prøvekjøring)' || '' }}"

# Fletter en koblet endring: service-PR-er som krever nye e2e-tester, og e2e-PR-en som
# retter testene. melosys-console starter workflowen. Lesing bruker github.token (alle repoene
# er offentlige). Hver skriving får et app-token for ett repo, hentet i steget rett før.
# Logikken ligger i scripts/koblet-merge.mjs; oppskriften i docs/ci-cd/KOBLEDE-ENDRINGER.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Taggen fra «E2E med brancher»: br-<run_id>'
        required: true
        type: string
      e2e_pr:
        description: 'PR-nummeret i melosys-e2e-tests'
        required: true
        type: string
      tjenester:
        description: '<repo>#<pr> i merge-rekkefølge, kommaseparert (f.eks. melosys-skjema-api#422,melosys-skjema-web#695). Bare repoer med merge-kø.'
        required: true
        type: string
      requested_by:
        description: 'Hvem som bestilte kjøringen. Settes av melosys-console.'
        required: false
        type: string
        default: ukjent
      dry_run:
        description: 'Les og sjekk alt, men skriv ingenting'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: koblet-merge-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  E2E_PR: ${{ inputs.e2e_pr }}
  TJENESTER: ${{ inputs.tjenester }}
  REQUESTED_BY: ${{ inputs.requested_by }}
  DRY_RUN: ${{ inputs.dry_run }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  GH_TOKEN: ${{ github.token }}

jobs:
  sjekk:
    name: Sjekk paret
    runs-on: ubuntu-latest
    # Rom for at timekvoten fornyes (inntil 3 × 15 min i ett kall)
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.input.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Les input
        id: input
        run: node scripts/koblet-merge.mjs input
      - name: Sjekk PR-ene
        run: node scripts/koblet-merge.mjs sjekk

  pin:
    name: Legg pinnen i e2e-PR-en
    needs: sjekk
    runs-on: ubuntu-latest
    # Rom for at timekvoten fornyes (inntil 3 × 15 min i ett kall)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sjekk pinnen
        id: les
        run: node scripts/koblet-merge.mjs pin-sjekk
      - name: Hent app-token
        id: token
        if: ${{ !inputs.dry_run && steps.les.outputs.trengs == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: melosys-e2e-tests
          permission-contents: write
          permission-pull-requests: write
      - name: Commit pinnen
        id: skriv
        if: ${{ !inputs.dry_run && steps.les.outputs.trengs == 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/koblet-merge.mjs pin-skriv

  e2e-ko:
    name: e2e-PR gjennom køen
    needs: pin
    runs-on: ubuntu-latest
    # 30 min til PR-en er klar + 150 min i køen
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vent til PR-en er klar for køen
        id: klar
        run: node scripts/koblet-merge.mjs e2e-klar
      - name: Hent app-token
        id: token
        if: ${{ !inputs.dry_run && steps.klar.outputs.status == 'klar' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: melosys-e2e-tests
          permission-contents: write
          permission-pull-requests: write
      - name: Sett PR-en i køen
        id: ko
        if: ${{ !inputs.dry_run && steps.klar.outputs.status == 'klar' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_ID: ${{ steps.klar.outputs.id }}
          HEAD_OID: ${{ steps.klar.outputs.head }}
        run: node scripts/koblet-merge.mjs sett-i-ko melosys-e2e-tests "$E2E_PR"
      - name: Vent til PR-en er merget
        env:
          SATT_I_KO: ${{ steps.ko.outputs.satt }}
        run: node scripts/koblet-merge.mjs vent-merget melosys-e2e-tests "$E2E_PR"

  service:
    name: "${{ matrix.repo }} #${{ matrix.pr }} i køen"
    needs: [sjekk, e2e-ko]
    runs-on: ubuntu-latest
    # 60 min på tom kø + 30 min til PR-en er klar + 150 min i køen
    timeout-minutes: 250
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.sjekk.outputs.matrix) }}
    env:
      REPO: ${{ matrix.repo }}
      PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vent på tom kø og til PR-en er klar
        id: klar
        run: node scripts/koblet-merge.mjs service-klar "$REPO" "$PR"
      - name: Hent app-token
        id: token
        if: ${{ !inputs.dry_run && steps.klar.outputs.status == 'klar' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - name: Sett PR-en i køen
        id: ko
        if: ${{ !inputs.dry_run && steps.klar.outputs.status == 'klar' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_ID: ${{ steps.klar.outputs.id }}
          HEAD_OID: ${{ steps.klar.outputs.head }}
        run: node scripts/koblet-merge.mjs sett-i-ko "$REPO" "$PR"
      - name: Vent til PR-en er merget
        env:
          SATT_I_KO: ${{ steps.ko.outputs.satt }}
        run: node scripts/koblet-merge.mjs vent-merget "$REPO" "$PR"

  fjern-pin:
    name: Fjern pinnen
    needs: service
    runs-on: ubuntu-latest
    # Rom for at timekvoten fornyes (inntil 3 × 15 min i ett kall)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sjekk service-PR-ene og pinnen på main
        id: les
        run: node scripts/koblet-merge.mjs fjern-sjekk
      - name: Hent app-token
        id: token
        if: ${{ !inputs.dry_run && steps.les.outputs.ferdig == 'false' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: melosys-e2e-tests
          permission-contents: write
          permission-pull-requests: write
      # Utvikleren merger PR-en med «Merge when ready»; e2e-køen er grønn først når latest har endringene.
      - name: Lag branchen og PR-en
        if: ${{ !inputs.dry_run && steps.les.outputs.ferdig == 'false' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/koblet-merge.mjs fjern-skriv
