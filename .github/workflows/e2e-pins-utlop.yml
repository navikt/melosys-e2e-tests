name: Utløpte e2e-pinner

# Regel 7 i docs/ci-cd/KOBLEDE-ENDRINGER.md: en pin i .github/e2e-pins.json skal være borte innen
# `utloper`. Hver kjøring av E2E Tests gir en advarsel for en utløpt pin, men Slack varsles ellers
# bare ved røde dispatch-kjøringer. Denne workflowen validerer fila hver morgen med samme kode og
# app-token som jobben «pinner» i e2e-for-merge.yml, og poster i #melosys-ci når en pin er utløpt
# eller fila ikke lenger er gyldig (for eksempel fordi en pinnet tag er ryddet bort fra GAR).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  utlop:
    name: Sjekk pinnene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Finnes det pinner?
        id: finnes
        run: |
          # Samme tolkning som plan-jobben i E2E Tests: en fil den avviser (null, [], "", ugyldig
          # JSON), valideres her også, så jobben feiler og varsler. Feiler kallet, valideres fila;
          # krasjer lib/e2e-pins.mjs, feiler neste steg, og Slack varsles om at sjekken feilet.
          PINNER=$(node lib/e2e-pins.mjs har-pinner --fil .github/e2e-pins.json) || PINNER=true
          if [ "$PINNER" = "false" ]; then
            echo "✅ Ingen pinner i .github/e2e-pins.json."
          fi
          echo "pinner=$PINNER" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN leser ikke de interne service-repoene (D12). Tokenen gjelder bare repoene til
      # pinnene i fila, som i jobben «pinner».
      - name: Hvilke repoer trenger tokenen?
        id: repoer
        if: steps.finnes.outputs.pinner == 'true'
        run: |
          REPOER=$(node lib/e2e-pins.mjs app-repoer --fil .github/e2e-pins.json)
          echo "🔑 Repoer for app-tokenen: ${REPOER:-ingen}"
          echo "repoer=$REPOER" >> "$GITHUB_OUTPUT"

      - name: Hent app-token
        id: app-token
        if: steps.finnes.outputs.pinner == 'true' && steps.repoer.outputs.repoer != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MELOSYS_CI_CLIENT_ID }}
          private-key: ${{ secrets.MELOSYS_CI_PRIVATE_KEY }}
          owner: navikt
          repositories: ${{ steps.repoer.outputs.repoer }}
          permission-contents: read

      - name: Login to NAIS registry
        if: steps.finnes.outputs.pinner == 'true'
        uses: nais/login@v0
        with:
          team: teammelosys

      - name: Valider pin-fila
        id: valider
        if: steps.finnes.outputs.pinner == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          RC=0
          SVAR=$(node lib/e2e-pins.mjs valider --fil .github/e2e-pins.json 2>"$RUNNER_TEMP/pins.err") || RC=$?
          while IFS= read -r linje; do echo "::error::$linje"; done < "$RUNNER_TEMP/pins.err"
          # Verdiene i utlopt er validert (kjent tjeneste, MELOSYS-nøkkel, dato).
          UTLOPT=$(jq -r '.utlopt[]? | "• \(.tjeneste) (\(.jira)) utløp \(.utloper)"' <<<"$SVAR") || UTLOPT=""
          if [ -n "$UTLOPT" ]; then
            while IFS= read -r linje; do echo "::warning::Utløpt pin: ${linje#• }"; done <<<"$UTLOPT"
          fi
          # Feilmeldingene er vasket i lib/e2e-pins.mjs (ingen kontrolltegn eller ::).
          FEIL=$(sed 's/^/• /' "$RUNNER_TEMP/pins.err")
          [ "$RC" -eq 0 ] || [ -n "$FEIL" ] || FEIL="• valideringen feilet uten melding, se jobbloggen"
          SKILLE="EOF_$(openssl rand -hex 16)"
          {
            echo "utlopt<<$SKILLE"
            printf '%s\n' "$UTLOPT"
            echo "$SKILLE"
            echo "feil<<$SKILLE"
            if [ "$RC" -ne 0 ]; then printf '%s\n' "$FEIL"; fi
            echo "$SKILLE"
          } >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "varsle=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$UTLOPT" ]; then
            echo "varsle=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Alle pinnene er gyldige, og ingen er utløpt."
          fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      # Også når et steg har feilet (token, GAR-innlogging, krasj i lib/e2e-pins.mjs): da er
      # pinnene ikke sjekket i dag, og ingen andre ser det.
      - name: Bygg Slack-melding
        id: melding
        if: failure() || steps.valider.outputs.varsle == 'true'
        env:
          UTLOPT: ${{ steps.valider.outputs.utlopt }}
          FEIL: ${{ steps.valider.outputs.feil }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Slack leser <, > og & som formatering: <url|tekst> blir en lenke og <!channel> varsler
          # kanalen. Tekst fra pin-fila og branchnavnet escapes, så de vises som tekst.
          slack_tekst() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          REF_URL=$(jq -rn --arg r "$REF" '$r | @uri | gsub("%2F"; "/")')
          FIL_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${REF_URL}/.github/e2e-pins.json"
          REF=$(slack_tekst "$REF")
          UTLOPT=$(slack_tekst "$UTLOPT")
          FEIL=$(slack_tekst "$FEIL")
          # Doble backslash: meldingen skrives med printf '%b', som ellers tolker «\c» som «stopp her».
          UTLOPT="${UTLOPT//\\/\\\\}"
          FEIL="${FEIL//\\/\\\\}"
          MELDING=""
          if [ -n "$UTLOPT" ]; then
            MELDING="*Utløpte pinner* i <${FIL_URL}|.github/e2e-pins.json>:\n${UTLOPT//$'\n'/\\n}\n\nFjern pinnen, eller sett ny \`utloper\`, i en PR til melosys-e2e-tests. Oppskriften står i docs/ci-cd/KOBLEDE-ENDRINGER.md.\n\n"
          fi
          if [ -n "$FEIL" ]; then
            MELDING="${MELDING}*Pin-fila er ikke gyldig.* E2E Tests stopper i plan-jobben til den er rettet:\n${FEIL//$'\n'/\\n}\n\n"
          fi
          if [ -z "$UTLOPT" ] && [ -z "$FEIL" ]; then
            MELDING="*Sjekken av pin-fila feilet* før den ble ferdig, så pinnene er ikke sjekket i dag. Se kjøringen.\n\n"
          fi
          if [ "$REF" != "main" ]; then
            MELDING="${MELDING}_Kjørt fra branchen \`${REF}\`, ikke main._\n"
          fi
          MELDING="${MELDING}*Workflow run:* <${RUN_URL}|#${GITHUB_RUN_ID}>"
          SKILLE="SLACK_EOF_$(openssl rand -hex 16)"
          {
            echo "SLACK_MESSAGE<<${SKILLE}"
            printf '%b' "$MELDING"  # inn i heredocen med tilfeldig skilletegn, ikke til loggen
            echo
            echo "${SKILLE}"
          } >> "$GITHUB_OUTPUT"

      # Samme Slack-oppsett som notify-slack i e2e-tests.yml.
      - name: Slack Notification
        if: "!cancelled() && steps.melding.outcome == 'success'"
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_COLOR: warning
          SLACK_TITLE: "E2E-pinner må ryddes"
          SLACK_FOOTER: "melosys-e2e-tests"
          SLACK_MESSAGE: ${{ steps.melding.outputs.SLACK_MESSAGE }}
          MSG_MINIMAL: "true"

      - name: Feil jobben når fila er ugyldig
        if: steps.valider.outputs.rc != '' && steps.valider.outputs.rc != '0'
        run: |
          echo "::error::.github/e2e-pins.json er ikke gyldig. Se steget «Valider pin-fila»."
          exit 1
