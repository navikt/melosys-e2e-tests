name: Test Quality

# Lett guardrail mot grønn-men-meningsløs e2e-test (jf. e2e-audit 2026-06-08).
# Ren Node, ingen docker-stack — kjører på sekunder.

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'scripts/check-vacuous-tests.mjs'
      - '.github/workflows/**'
      - 'scripts/check-workflow-log-injection.mjs'
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'scripts/check-vacuous-tests.mjs'
      - '.github/workflows/**'
      - 'scripts/check-workflow-log-injection.mjs'

permissions:
  contents: read

jobs:
  check-vacuous-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sjekk for expect(true) og svelge-catcher
        run: npm run check:tests

      - name: Sjekk workflow-logging for verdier utenfra
        run: npm run check:workflow

      # Uten denne er sjekken over upinnet: en endring i
      # check-workflow-log-injection.mjs kunne slå av sin egen deteksjon i det
      # stille. Testene er rene node-builtins, så jobben trenger fortsatt ikke
      # npm ci — det er derfor test:scripts og ikke test:unit (som krever ts-node).
      - name: Test sjekkene selv
        run: npm run test:scripts
